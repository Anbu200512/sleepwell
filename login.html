<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — SleepWell Sleep & CPAP Clinic</title>
  <meta name="description" content="Secure sign in to access sleep study results, CPAP telemetry, and appointment booking.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230d9488'><path d='M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z'/></svg>">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            clinical: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            },
            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a',
              950: '#042f2e',
            }
          }
        }
      }
    }
  </script>

  <!-- Prevent Theme & RTL Flash -->
  <script>
    (function() {
      const theme = localStorage.getItem('sleepwell_theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      const dir = localStorage.getItem('sleepwell_direction') || 'ltr';
      document.documentElement.setAttribute('dir', dir);
    })();
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased transition-colors duration-200 min-h-screen flex flex-col justify-between">

  <!-- Theme & Direction Controls -->
  <div class="fixed top-4 end-4 z-50 flex items-center gap-2">
    <button id="dir-toggle" type="button" onclick="toggleDirection()" class="w-10 h-10 rounded-xl grid place-items-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-teal-600 transition shadow-sm" title="Switch text direction" aria-label="Switch text direction">
      <i data-lucide="arrow-left-right" class="w-[18px] h-[18px]"></i>
    </button>
    <button id="theme-toggle" type="button" onclick="toggleTheme()" class="w-10 h-10 rounded-xl grid place-items-center bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 hover:text-teal-600 transition shadow-sm" title="Toggle dark or light mode" aria-label="Toggle dark or light mode">
      <span class="theme-icon-sun hidden"><i data-lucide="sun" class="w-[18px] h-[18px] text-amber-400"></i></span>
      <span class="theme-icon-moon block"><i data-lucide="moon" class="w-[18px] h-[18px]"></i></span>
    </button>
  </div>


  <!-- Login Main Content -->
  <main class="flex-1 py-16 flex items-center justify-center px-4 sm:px-6 lg:px-8">
    <div class="w-full max-w-md">
      
      <!-- Card Container -->
      <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-2xl p-8 sm:p-10 relative overflow-hidden">
        
        <!-- Subtle Top Glow -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-teal-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Brand Logo -->
        <a href="index.html" class="flex items-center justify-center gap-2.5 mb-6 group" title="Back to home">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sky-600 via-teal-500 to-teal-400 flex items-center justify-center text-white shadow-md shadow-teal-500/20 group-hover:scale-105 transition-transform">
            <svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </div>
          <span class="text-xl font-black tracking-tight text-slate-900 dark:text-white group-hover:text-teal-600 dark:group-hover:text-teal-400 transition-colors">Sleep<span class="text-teal-600 dark:text-teal-400">Well</span></span>
        </a>

        <!-- Header -->
        <div class="text-center mb-8">
          <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">Sign In</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Access your records, appointments and clinic services</p>
        </div>

        <!-- Login Form -->
        <form id="patient-login-form" class="space-y-4">
          
          <div>
            <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">
              Email or Mobile Number
            </label>
            <div class="relative">
              <input 
                type="text" 
                id="login-identifier" 
                required 
                placeholder="sarah@sleepwell.clinic"
                class="w-full pl-10 pr-4 rtl:pl-4 rtl:pr-10 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none transition"
              >
              <div class="absolute inset-y-0 left-0 rtl:left-auto rtl:right-0 pl-3.5 rtl:pl-0 rtl:pr-3.5 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="mail" class="w-4 h-4"></i>
              </div>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">
                Password
              </label>
              <button type="button" onclick="openForgotPasswordModal()" class="text-xs text-teal-600 dark:text-teal-400 hover:underline">
                Forgot password?
              </button>
            </div>
            <div class="relative">
              <input 
                type="password" 
                id="login-password" 
                required 
                placeholder="••••••••••••"
                class="w-full pl-10 pr-10 rtl:pl-10 rtl:pr-10 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white text-sm focus:ring-2 focus:ring-teal-500 focus:outline-none transition"
              >
              <div class="absolute inset-y-0 left-0 rtl:left-auto rtl:right-0 pl-3.5 rtl:pl-0 rtl:pr-3.5 flex items-center pointer-events-none text-slate-400">
                <i data-lucide="lock" class="w-4 h-4"></i>
              </div>
              <button type="button" onclick="togglePasswordVisibility('login-password')" class="absolute inset-y-0 right-0 rtl:right-auto rtl:left-0 pr-3.5 rtl:pr-0 rtl:pl-3.5 flex items-center text-slate-400 hover:text-slate-600">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me Checkbox -->
          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer">
              <input type="checkbox" id="remember-me" checked class="w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500">
              <span class="text-xs text-slate-600 dark:text-slate-400">Remember this device</span>
            </label>
            <span class="text-[11px] text-slate-400">HIPAA Protected</span>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            class="w-full py-3.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2 rtl:space-x-reverse"
          >
            <span>Sign In</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>

        </form>

        <!-- Social Sign-In -->
        <div class="mt-6 pt-5 border-t border-slate-100 dark:border-slate-800">
          <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 text-center mb-3">or continue with</p>
          <div class="grid grid-cols-3 gap-3">
            <button type="button" onclick="socialLogin('Google')" class="py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300 transition flex items-center justify-center gap-2" title="Continue with Google">
              <svg viewBox="0 0 24 24" class="w-4 h-4" aria-hidden="true">
                <path fill="#4285F4" d="M23.06 12.25c0-.85-.08-1.67-.22-2.45H12v4.64h6.2a5.3 5.3 0 0 1-2.3 3.48v2.9h3.72c2.18-2 3.44-4.96 3.44-8.57z"/>
                <path fill="#34A853" d="M12 24c3.11 0 5.72-1.03 7.62-2.79l-3.72-2.89c-1.03.69-2.35 1.1-3.9 1.1-3 0-5.54-2.02-6.45-4.75H1.7v2.98A11.99 11.99 0 0 0 12 24z"/>
                <path fill="#FBBC05" d="M5.55 14.67a7.2 7.2 0 0 1 0-4.6V7.09H1.7a12 12 0 0 0 0 10.56l3.85-2.98z"/>
                <path fill="#EA4335" d="M12 4.75c1.69 0 3.21.58 4.4 1.72l3.3-3.3C17.72 1.2 15.11 0 12 0 7.36 0 3.36 2.67 1.7 6.55l3.85 2.98C6.46 6.77 9 4.75 12 4.75z"/>
              </svg>
              <span class="hidden sm:inline">Google</span>
            </button>
            <button type="button" onclick="socialLogin('Apple')" class="py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300 transition flex items-center justify-center gap-2" title="Continue with Apple">
              <svg viewBox="0 0 24 24" class="w-4 h-4 fill-current" aria-hidden="true">
                <path d="M16.365 1.43c0 1.14-.42 2.2-1.25 3.05-.9.92-2 1.45-3.16 1.36-.14-1.1.4-2.24 1.2-3.05.87-.9 2.16-1.47 3.21-1.36zM20.9 17.13c-.55 1.27-.82 1.84-1.53 2.96-.99 1.57-2.39 3.52-4.12 3.53-1.54.02-1.93-1-4.02-.99-2.09.01-2.52 1.01-4.06.99-1.73-.02-3.05-1.77-4.04-3.34C.4 16.36-.05 11.5 1.72 8.9c1.01-1.5 2.6-2.44 4.11-2.44 1.54 0 2.51 1.01 3.79 1.01 1.23 0 1.98-1.01 3.77-1.01 1.35 0 2.79.74 3.81 2.01-3.35 1.83-2.81 6.6.7 8.66z"/>
              </svg>
              <span class="hidden sm:inline">Apple</span>
            </button>
            <button type="button" onclick="socialLogin('Facebook')" class="py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-50 dark:hover:bg-slate-700 text-xs font-semibold text-slate-700 dark:text-slate-300 transition flex items-center justify-center gap-2" title="Continue with Facebook">
              <svg viewBox="0 0 24 24" class="w-4 h-4" aria-hidden="true">
                <path fill="#1877F2" d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/>
              </svg>
              <span class="hidden sm:inline">Facebook</span>
            </button>
          </div>
        </div>

        <!-- Signup Prompt -->
        <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
          <p class="text-xs text-slate-500 dark:text-slate-400">
            New to SleepWell?
            <a href="signup.html" class="text-teal-600 dark:text-teal-400 font-bold hover:underline">
              Create your account
            </a>
          </p>
        </div>

      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="js/main.js?v=20261007f"></script>
  <script src="js/auth.js"></script>
  <script>
    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      if (field) {
        field.type = field.type === 'password' ? 'text' : 'password';
      }
    }
  </script>
</body>
</html>
